<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f6f7f9; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        nav a { color: inherit; text-decoration: none; }
        .nav-links { display: flex; gap: 16px; }
        .back { display: inline-block; margin-bottom: 18px; color: #374151; text-decoration: none; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
        h1 { margin: 0 0 8px; }
        h2 { margin-top: 0; }
        .muted { color: #6b7280; overflow-wrap: anywhere; }
        .status { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 12px; background: #eef2ff; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 28px; }
        .actions form { margin: 0; }
        button, .button { font: inherit; border: 1px solid #d1d5db; background: white; padding: 9px 13px; border-radius: 8px; cursor: pointer; text-decoration: none; color: #111827; }
        .primary { background: #111827; color: white; border-color: #111827; }
        .danger { color: #b91c1c; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .meta-label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .error { color: #b91c1c; overflow-wrap: anywhere; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
        th { font-size: 12px; color: #6b7280; }
        .empty { color: #6b7280; padding: 12px 0; }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <strong>Data Collector</strong>
        <div class="nav-links">
            <a href="/datasets">Datasets</a>
            <a href="/collector-dashboard">Collectors</a>
        </div>
    </nav>

    <a class="back" href="/collector-dashboard">← Back to Collectors</a>

    <div class="header">
        <div>
            <h1 th:text="${collector.name}">Collector</h1>
            <div class="muted" th:text="${collector.url}">API URL</div>
        </div>
        <span class="status" th:text="${collector.status}">ACTIVE</span>
    </div>

    <div class="actions">
        <form th:if="${collector.active}"
              th:action="@{/collector-dashboard/{id}/stop(id=${collector.id})}"
              method="post">
            <button type="submit">Stop</button>
        </form>

        <form th:unless="${collector.active}"
              th:action="@{/collector-dashboard/{id}/start(id=${collector.id})}"
              method="post">
            <button class="primary" type="submit">Start</button>
        </form>

        <form th:action="@{/collector-dashboard/{id}/collect(id=${collector.id})}" method="post">
            <button class="primary" type="submit">Collect now</button>
        </form>

        <a class="button" th:href="@{/collectors/{id}/export(id=${collector.id})}">Download CSV</a>

        <form th:action="@{/collector-dashboard/{id}/delete(id=${collector.id})}"
              method="post"
              onsubmit="return confirm('Collector wirklich löschen?');">
            <button class="danger" type="submit">Delete</button>
        </form>
    </div>

    <div class="grid">
        <div class="card">
            <span class="meta-label">Interval</span>
            <strong><span th:text="${collector.intervalSeconds}">0</span> seconds</strong>
        </div>
        <div class="card">
            <span class="meta-label">Records path</span>
            <strong th:text="${collector.recordsPath}">current</strong>
        </div>
        <div class="card">
            <span class="meta-label">Created</span>
            <strong th:text="${collector.createdAt}">-</strong>
        </div>
        <div class="card">
            <span class="meta-label">Last run</span>
            <strong th:text="${collector.lastRunAt != null ? collector.lastRunAt : 'Noch nie'}">Noch nie</strong>
        </div>
    </div>

    <div class="card" th:if="${collector.lastError != null}">
        <h2>Last error</h2>
        <p class="error" th:text="${collector.lastError}"></p>
    </div>

    <section class="card">
        <h2>Fields</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Source</th>
                    <th>Type</th>
                    <th>Unit</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="field : ${collector.fieldMappings}">
                    <td th:text="${field.targetName}"></td>
                    <td th:text="${field.sourcePath}"></td>
                    <td th:text="${field.dataType}"></td>
                    <td th:text="${field.unit}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2>Collected Data</h2>
        <div class="empty" th:if="${#lists.isEmpty(records)}">Noch keine Daten gesammelt.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(records)}">
            <table>
                <thead>
                <tr>
                    <th>Time</th>
                    <th th:each="field : ${collector.fieldMappings}" th:text="${field.targetName}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${record.collectedAt}"></td>
                    <td th:each="field : ${collector.fieldMappings}"
                        th:text="${record.payload[field.targetName]}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
