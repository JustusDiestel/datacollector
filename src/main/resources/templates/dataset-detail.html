<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f6f7f9; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        nav a, .back { color: inherit; text-decoration: none; }
        .nav-links { display: flex; gap: 16px; }
        .back { display: inline-block; margin-bottom: 18px; color: #374151; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
        h1 { margin: 0 0 8px; }
        .muted { color: #6b7280; }
        .status { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 12px; background: #eef2ff; }
        .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 24px; }
        .meta-item { background: #f9fafb; border-radius: 8px; padding: 14px; }
        .meta-label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 5px; }
        .actions { display: flex; gap: 10px; margin: 18px 0; }
        button { font: inherit; border: 1px solid #d1d5db; background: white; padding: 9px 13px; border-radius: 8px; cursor: pointer; }
        .danger { color: #b91c1c; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
        th { font-size: 12px; color: #6b7280; }
        .empty { color: #6b7280; padding: 12px 0; }
    </style>
</head>
<body>
<div class="container">

    <nav>
        <strong>Data Collector</strong>
        <div class="nav-links">
            <a href="/datasets">Datasets</a>
            <a href="/collector-dashboard">Collectors</a>
        </div>
    </nav>

    <a class="back" href="/datasets">← Back to Datasets</a>

    <section class="card">
        <div class="header">
            <div>
                <h1 th:text="${dataset.name}">Dataset Name</h1>
                <p class="muted" th:text="${dataset.description}">Beschreibung</p>
            </div>

            <span class="status" th:text="${dataset.status}">
                RUNNING
            </span>
        </div>

        <div class="meta">
            <div class="meta-item">
                <span class="meta-label">Created</span>
                <strong th:text="${dataset.createdAt}">-</strong>
            </div>

            <div class="meta-item">
                <span class="meta-label">Records</span>
                <strong th:text="${dataset.recordCount}">0</strong>
            </div>
        </div>

        <div class="actions">
            <form th:action="@{/datasets/{id}/delete(id=${dataset.id})}"
                  method="post"
                  onsubmit="return confirm('Alle gesammelten Daten dieses Datasets wirklich löschen? Der Collector bleibt bestehen.');">
                <button class="danger" type="submit">Delete dataset data</button>
            </form>
        </div>
    </section>

    <section class="card">
        <h2>Collected Data</h2>

        <div class="empty" th:if="${#lists.isEmpty(dataset.records)}">
            Noch keine Daten vorhanden.
        </div>

        <div class="table-wrap" th:unless="${#lists.isEmpty(dataset.records)}">
            <table>
                <thead>
                <tr>
                    <th>Time</th>

                    <th th:each="field : ${dataset.fields}"
                        th:text="${field.targetName}">
                        Field
                    </th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="record : ${dataset.records}">
                    <td th:text="${record.collectedAt}"></td>

                    <td th:each="field : ${dataset.fields}"
                        th:text="${record.payload[field.targetName]}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
